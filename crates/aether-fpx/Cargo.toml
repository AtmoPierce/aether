[package]
name = "aether-fpx"
version = "0.1.0"
edition = "2021"


[[bin]]
name = "tanh_plot"
path = "src/bin/tanh_plot.rs"
required-features = ["ocp"]

[[bin]]
name = "trig_asm_probe_m33"
path = "src/bin/trig_asm_probe_m33.rs"
required-features = ["m33-probe"]

[[bin]]
name = "plot_all"
path = "src/bin/plot_all.rs"
required-features = ["ocp"]


[features]
default = []
# Allow the Cody-Waite reducer to use a native FMA when the target advertises it.
fma = []
# Enable explicit packed polynomial evaluators. The public API remains portable;
# x86/x86_64 uses AVX2 + FMA, AArch64 uses NEON, and other targets fall back to
# the scalar evaluator.
simd = []
ocp = ["dep:aether-viz", "dep:aether-fpx-bench"]
mx = ["ocp"]
m33-probe = ["dep:panic-halt"]

[dependencies]
aether-viz = { path = "../aether-viz", features = ["svg"], optional = true }
aether-fpx-bench = { path = "support/bench", optional = true }
panic-halt = { version = "1.0", optional = true }
serde = { version = "1", features = ["derive"] }
toml = "0.5"
libm = "0.2"

[lints]
workspace = true
