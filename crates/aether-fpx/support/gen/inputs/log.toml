  {n=6,k=7},
  {n=7,k=8},
  {n=8,k=9},
  {n=9,k=10},
  {n=10,k=11},
  {n=12,k=13},
  {n=15,k=16},
  {n=18,k=19},
  {n=19,k=20},
  {n=20,k=21},
  {n=21,k=22},
  {n=22,k=23},
