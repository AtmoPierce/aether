max_ulp_f32 = 5
abs_tol_f64 = 1.0e-16
abs_tol_f32 = 2.0e-8

[functions.log1p.sweep]
enabled        = true
interval       = [-0.2928932188134525, 0.4142135623730951]   # sqrt(0.5)-1 .. sqrt(2)-1
min_width      = 0.2
max_segments   = 10
split_strategy = "worst"
