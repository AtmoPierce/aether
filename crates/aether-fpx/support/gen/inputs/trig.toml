# trig.toml
# 
# =============================================================================
# SINE (kernel)
# =============================================================================

[functions.sin]
file_prefix = "sin"
quadrants   = []
mirror      = true

[functions.sin.acceptance]
max_ulp_f64 = 5
max_ulp_f32 = 5
abs_tol_f64 = 1.0e-16
abs_tol_f32 = 2.0e-8

[functions.sin.sweep]
enabled        = true
interval       = [0.0, "pi/2"]
min_width      = 0.25
max_segments   = 8
split_strategy = "worst"
merge_pass     = false
samples        = 0

candidates  = [
  {n=2,k=3},
  {n=3,k=4},
  {n=4,k=5},
  {n=5,k=6},
  {n=6,k=7},
  {n=7,k=8},
  {n=8,k=9},
  {n=9,k=10},
  {n=10,k=11},
  {n=12,k=13},
  {n=15,k=16},
  {n=18,k=19},
  {n=19,k=20},
  {n=20,k=21},
  {n=21,k=22},
  {n=22,k=23}
]

w_madds     = 1.0
w_segments  = 3.0
w_selectors = 1.0

# =============================================================================
# COSINE (kernel)
# =============================================================================

[functions.cos]
file_prefix = "cos"
quadrants   = ["cos"]
mirror      = true
segments    = []

[functions.cos.acceptance]
max_ulp_f64 = 5
max_ulp_f32 = 5
