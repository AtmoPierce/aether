[package]
name = "aether-fpx-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
aether-core = {path = "../../../aether-core", features = ["std", "f16", "f128", "fma", "simd"]}
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
aether-viz = {path = "../../../aether-viz", features = ["svg"]}
toml = {version = "*"}
aether-fpx-bench = {path = "../bench"}
num-bigint = "0.4"

[features]
default = []

[lints]
workspace = true
