[package]
name = "aether-graphics"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license-file.workspace = true

[features]
default = ["no_std"]
std = ["dep:stl_io"]
pro = ["std", "dep:aether-pro", "dep:serde", "dep:bincode"]
no_std = []

[lib]
crate-type = ["rlib"]

[dependencies]
aether-core = { path = "../aether-core" }
aether-pro = { package = "aether-pro", path = "../../../aether-pro/crates/aether-pro", default-features = false, features = ["step"], optional = true }
serde = { workspace = true, optional = true }
bincode = { workspace = true, features = ["serde"], optional = true }
stl_io = { version = "0.7.0", optional = true }
