[workspace]
resolver = "2"
members = [
    "crates/aether",
    "crates/aether-benchmark", 
    "crates/aether-catalogs",
    "crates/aether-core", 
    "crates/aether-fft",
    "crates/aether-examples", 
    "crates/aether-fluids",
    "crates/aether-gpu",
    "crates/aether-graphics",
    "crates/aether-interp",
    "crates/aether-ml",
    "crates/aether-models",
    "crates/aether-opt",
    "crates/aether-rand",
    "crates/aether-shapes",
    "crates/aether-stats", 
    "crates/aether-test", 
    "crates/aether-time",
    "crates/aether-units", 
    "crates/aether-viz",
    "crates/aether-nist"
]
exclude = []

[workspace.package]
edition = "2024"
license-file = "LICENSE.txt"
rust-version = "1.99"
version = "0.1.2"

[workspace.dependencies]
approx = "0.5"
bincode = "2.0.1"
# criterion = "0.5"
csv = "*"
libm = "0.2"
minstant = "0.1.7"
once_cell = "1"
plotters = { version = "0.3.7", default-features = false }
regex = "1"
rustyline = "13"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.6.0"

[workspace.lints.rust]
# Make warnings fail in CI without breaking local dev:
unused = "warn"
unused_imports = "warn"
missing_docs = "allow"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
tag-message = "Release {{version}}"

[profile.release]
# opt-level = 0     # no optimizations
# opt-level = 1     # basic optimizations
# opt-level = 2     # some optimizations
opt-level = 3       # all optimizations
# opt-level = "s"   # optimize for binary size
# opt-level = "z"   # optimize for binary size, but also turn off loop vectorization
# debug = true      # include debug symbols
panic = "abort"     # Results in smaller code size
lto = "fat"         # enable for max performance
codegen-units = 1   # best runtime performance, slower compilation

[profile.bench]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"

[profile.dev]
# split-debuginfo = "unpacked"
# opt-level = 1
panic = "abort"

[profile.dev.package."*"]
# Optimize all dependencies even in debug builds
opt-level = 2
